; ============================================================
;  DXCC代行ワッチ 自局の設定ファイル
;  メモ帳で開き、「＜＞」の部分をご自分の値に書き換えてください。
;  保存するときは、文字コードを「UTF-8」にします。
;  パスワードはこのファイルに書きません（環境変数に登録します）。
; ============================================================

[station]
; 自局のコールサイン。DXCCの交信済み判定には、ここに書いたコールでの交信だけを数えます。
; 複数のコールの交信を合算する場合は、カンマで区切って並べます（例: JA1ABC, JA1ABC/1）。
; 他局の設備・コールサインでの運用（ゲスト運用）は数えません。
my_call = ＜自局のコールサイン＞

; 通知メールの送信に使うGmailアドレス（通知専用に作ったアカウントをおすすめします）
mail_from = ＜送信用のGmailアドレス＞

; 通知を受け取るアドレス（スマートフォンで受信するもの。送信用とは別のアドレスにします）
mail_to = ＜受信用のメールアドレス＞

; 自局のグリッドロケータ（例: PM85）。書くと、通知にアンテナを向ける目安の方位が付きます。
; 使わない場合は、= の後ろを空けておきます。
my_grid =

; LoTW の Web サイトのユーザー名（使わない場合は空けておきます）
; パスワードは環境変数 LOTW_PASS に登録します。
lotw_user =

; LoTW の証明書の開始日（hamlog_to_lotw.py で使います。例: 2003-09-06）
; 空けておくと、日付による除外をしません。
lotw_cert_start =

[sites]
; PCごとの名前。起動用のbatファイルで --site に書くIDと、メールの件名に出る名前の対応です。
; batファイルに日本語を書くと文字化けしやすいため、ここで対応させます。
; 1台だけなら、この1行のままで構いません。
home = 自宅
