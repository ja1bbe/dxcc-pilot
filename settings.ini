; ============================================================
;  DXCC代行ワッチ 自局の設定ファイル
;  メモ帳で開き、「＜＞」の部分をご自分の値に書き換えてください。
;  保存するときは、文字コードを「UTF-8」にします。
;  パスワードはこのファイルに書きません（環境変数に登録します）。
; ============================================================

[station]
; 自局のコールサイン。DXCCの交信済み判定には、ここに書いたコールでの交信だけを数えます。
; 複数のコールの交信を合算する場合は、カンマで区切って並べます（例: JA1ABC, JA1ABC/1）。
; 他局の設備・コールサインでの運用（ゲスト運用）は数えません。
my_call = ＜自局のコールサイン＞

; 通知メールの送信に使うGmailアドレス（通知専用に作ったアカウントをおすすめします）
mail_from = ＜送信用のGmailアドレス＞

; 通知を受け取るアドレス（スマートフォンで受信するもの。送信用とは別のアドレスにします）
mail_to = ＜受信用のメールアドレス＞

; 自局のグリッドロケータ（例: PM85）。書くと、通知にアンテナを向ける目安の方位が付きます。
; 使わない場合は、= の後ろを空けておきます。
my_grid =

; LoTW の Web サイトのユーザー名（使わない場合は空けておきます）
; パスワードは環境変数 LOTW_PASS に登録します。
lotw_user =

; LoTW の証明書の開始日（hamlog_to_lotw.py で使います。例: 2003-09-06）
; 空けておくと、日付による除外をしません。
lotw_cert_start =

[sites]
; PCごとの名前。起動用のbatファイルで --site に書くIDと、メールの件名に出る名前の対応です。
; batファイルに日本語を書くと文字化けしやすいため、ここで対応させます。
; 1台だけなら、この1行のままで構いません。
home = 自宅

[cluster]
; ------------------------------------------------------------
;  DXクラスター通知（cluster_watch.py）の設定。使わない場合は、このままで構いません。
;  日本の局がDXクラスターに上げたスポットから、未交信の局を知らせます。
; ------------------------------------------------------------
; 通知するモード。FT8, FT4, CW, SSB から選び、カンマで区切って並べます。
; スポットにはモードの欄がないため、コメントと周波数から推定します。
modes = FT8, CW, SSB

; 通知するバンド。all（全バンド）か、160m, 80m のように並べます。
; 選べるのは 160m 80m 60m 40m 30m 20m 17m 15m 12m 10m 6m です。
bands = all

; 通知の種類。atno（全バンド初のみ）か、atno, bandnew（バンドニューも）を書きます。
notify = atno

; スポットの取得先。dxscape（DXSCAPE JA25）と dxsummit（DX Summit）の一方または両方。
sources = dxscape, dxsummit

; 取得の間隔（秒、60以上）。サイトに負担をかけないよう、短くしすぎないでください。
interval_sec = 120

; この分数より古いスポットは通知しません。
max_age_min = 30

; 同じ局・同じバンド・同じモードを、もう一度知らせるまでの時間（時間）。
renotify_hours = 6

; 1時間に送る通知の上限。
max_per_hour = 10
